name: Validate profiles
on:
  pull_request:
    paths:
      - 'data/profiles/**'
      - 'profiles.schema.json'
      - 'scripts/**'
      - 'package.json'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate and build manifest
        run: npm run validate
